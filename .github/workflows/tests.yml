name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install streamlit pypdf python-docx numpy google-genai
      - name: Compile Python source
        run: python -m compileall -q app.py smart_doc_assistant tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
